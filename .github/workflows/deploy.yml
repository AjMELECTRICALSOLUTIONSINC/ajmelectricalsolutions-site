name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _site
          cp -R *.html assets robots.txt sitemap.xml _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          for page in ('about', 'commercial', 'contact', 'holiday-lighting', 'industrial', 'projects', 'residential', 'services'):
              content = Path(f'{page}.html').read_text(encoding='utf-8')
              content = content.replace('<head>\n', '<head>\n  <base href="/">\n', 1)
              route = Path('_site') / page
              route.mkdir(parents=True, exist_ok=True)
              (route / 'index.html').write_text(content, encoding='utf-8')
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4